<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11, 11, 11, 0.10);
    --bar: #2a78d6;
    --bar-hover: #5598e7;
    --track: #cde2fb;
    --seq-0: #e1e0d9;
    --seq-1: #86b6ef;
    --seq-2: #5598e7;
    --seq-3: #256abf;
    --seq-4: #104281;
    --warning: #fab219;
    --warning-wash: rgba(250, 178, 25, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --ring: rgba(255, 255, 255, 0.10);
      --bar: #3987e5;
      --bar-hover: #6da7ec;
      --track: #184f95;
      --seq-0: #2c2c2a;
      --seq-1: #184f95;
      --seq-2: #256abf;
      --seq-3: #5598e7;
      --seq-4: #9ec5f4;
      --warning-wash: rgba(250, 178, 25, 0.12);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --bar: #3987e5;
    --bar-hover: #6da7ec;
    --track: #184f95;
    --seq-0: #2c2c2a;
    --seq-1: #184f95;
    --seq-2: #256abf;
    --seq-3: #5598e7;
    --seq-4: #9ec5f4;
    --warning-wash: rgba(250, 178, 25, 0.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; color: var(--ink-2); font-size: 13px; }

  .uyari {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 20px; padding: 12px 14px; border-radius: 10px;
    background: var(--warning-wash); box-shadow: inset 0 0 0 1px var(--warning);
    font-size: 14px;
  }
  .uyari svg { flex: none; margin-top: 2px; }
  .uyari strong { display: block; }

  .kart {
    background: var(--surface); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring);
    padding: 20px; margin-top: 16px;
  }
  .kart h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .kart .alt { color: var(--ink-2); font-size: 13px; margin: 2px 0 14px; }

  .ozet { display: grid; grid-template-columns: minmax(200px, 1.2fr) 3fr; gap: 16px; margin-top: 16px; }
  .ozet .kart { margin-top: 0; }
  .hero-etiket { color: var(--ink-2); font-size: 14px; }
  .hero-deger { font-size: 56px; font-weight: 600; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; }
  .hero-alt { color: var(--ink-2); font-size: 13px; margin-top: 8px; }
  .karolar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px 16px; }
  .karo-etiket { color: var(--ink-2); font-size: 13px; }
  .karo-deger { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .karo-alt { color: var(--muted); font-size: 12px; }

  .grafik { position: relative; width: 100%; }
  .grafik svg { display: block; overflow: visible; }
  .grafik text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grafik text.etiket { fill: var(--ink-2); font-weight: 600; }
  .grafik .hedef { fill: transparent; cursor: default; outline: none; }
  .grafik .hedef:focus-visible { stroke: var(--ink-2); stroke-width: 1; }
  .grafik .cubuk { fill: var(--bar); }
  .grafik .cubuk.aktif { fill: var(--bar-hover); }
  .grafik .hucre.aktif { stroke: var(--ink); stroke-width: 1.5; }

  .lejant { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; color: var(--ink-2); font-size: 12px; }
  .lejant i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .lejant span + i { margin-left: 8px; }

  .tablo-kap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 12px; padding: 0 12px 8px 0; white-space: nowrap; }
  td { padding: 10px 12px 10px 0; border-top: 1px solid var(--grid); vertical-align: middle; }
  td.sayi, th.sayi { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.kitap { min-width: 180px; }
  td.kitap .durum { color: var(--muted); font-size: 12px; }
  .ilerleme { display: flex; align-items: center; gap: 8px; min-width: 130px; }
  .metre { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .metre b { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
  .ilerleme span { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; width: 38px; text-align: right; }

  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
  details table { margin-top: 12px; }

  #ipucu {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface); color: var(--ink); border-radius: 8px;
    box-shadow: 0 0 0 1px var(--ring), 0 6px 20px rgba(0, 0, 0, 0.12);
    padding: 8px 10px; font-size: 12px; max-width: 260px;
  }
  #ipucu .deger { font-size: 15px; font-weight: 600; }
  #ipucu .baslik { color: var(--ink-2); }
  #ipucu .satir { display: flex; gap: 8px; justify-content: space-between; color: var(--ink-2); }
  #ipucu .satir b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }

  @media (max-width: 640px) {
    main { padding-top: 20px; }
    .ozet { grid-template-columns: 1fr; }
    .hero-deger { font-size: 48px; }
    .kart { padding: 16px; }
    .tablo-kap { margin: 0 -16px; padding: 0 16px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-metin="baslik"></h1>
    <p id="kaynak"></p>
  </header>
  <div id="uyari-yeri"></div>

  <section class="ozet">
    <div class="kart">
      <div class="hero-etiket" id="hero-etiket"></div>
      <div class="hero-deger" id="hero-deger"></div>
      <div class="hero-alt" id="hero-alt"></div>
    </div>
    <div class="kart"><div class="karolar" id="karolar"></div></div>
  </section>

  <section class="kart">
    <h2 data-metin="son30"></h2>
    <p class="alt" data-metin="gunlukAlt"></p>
    <div class="grafik" id="g-gunluk"></div>
  </section>

  <section class="kart">
    <h2 data-metin="takvimBaslik"></h2>
    <p class="alt" data-metin="takvimAlt"></p>
    <div class="grafik" id="g-takvim"></div>
    <div class="lejant" id="takvim-lejant"></div>
  </section>

  <section class="kart">
    <h2 data-metin="saatBaslik"></h2>
    <p class="alt" data-metin="saatAlt"></p>
    <div class="grafik" id="g-saat"></div>
  </section>

  <section class="kart">
    <h2 data-metin="kitaplar"></h2>
    <p class="alt" data-metin="kitaplarAlt"></p>
    <div class="tablo-kap">
      <table>
        <thead><tr>
          <th data-metin="thKitap"></th><th data-metin="thIlerleme"></th>
          <th class="sayi" data-metin="thToplam"></th><th class="sayi" data-metin="thTakipte"></th>
          <th class="sayi" data-metin="thSonOkuma"></th><th class="sayi" data-metin="thKalan"></th>
        </tr></thead>
        <tbody id="kitaplar"></tbody>
      </table>
    </div>
    <details>
      <summary data-metin="gunlukTablo"></summary>
      <div class="tablo-kap">
        <table>
          <thead><tr>
            <th data-metin="thTarih"></th><th class="sayi" data-metin="thSure"></th><th data-metin="kitaplar"></th>
          </tr></thead>
          <tbody id="gunluk-tablo"></tbody>
        </table>
      </div>
    </details>
  </section>

  <footer id="alt-bilgi"></footer>
</main>
<div id="ipucu" role="status" aria-live="polite"></div>

<script>
const V = /*VERI*/null;

// --- metinler ------------------------------------------------------------------------
// Dil Python tarafında seçilir ve V.dil olarak gelir. data-metin özelliği olan öğeler
// buradaki anahtarla doldurulur; parametreli metinler fonksiyon.
const METINLER = {
  tr: {
    sayfaBasligi: "Okuma İstatistiklerim",
    baslik: "Okuma istatistiklerim",
    kaynak: (sonVeri, takipBas) => `Son veri: ${sonVeri} · Takip başlangıcı: ${takipBas}`,
    uyari: "Uyarı",
    bugun: "Bugün",
    sonVeriGunu: tarih => `${tarih} (son veri)`,
    dun: s => `Dün: ${s}`,
    takipBugun: "Takip bugün başladı",
    buHafta: "Bu hafta",
    pazartesidenBeri: "Pazartesiden beri",
    buAy: ay => `Bu ay (${ay})`,
    seri: "Okuma serisi",
    gunSayisi: n => `${n} gün`,
    enUzun: gunler => `En uzun: ${gunler}`,
    ortalama: "Günlük ortalama",
    takiptekiGunler: n => `Takipteki ${n} gün`,
    son30: "Son 30 gün",
    bitenKitap: "Biten kitap",
    takipBasladigindanBeri: "Takip başladığından beri",
    koboToplam: "Kobo'daki toplam",
    tumKitaplar: "Tüm kitaplar",
    gunlukAlt: "Günlük okuma süresi",
    takvimBaslik: "Okuma takvimi",
    takvimAlt: "Son 26 hafta; boş alanlar takip öncesi",
    saatBaslik: "Günün hangi saatlerinde okuyorum?",
    saatAlt: "Takip başlangıcından beri toplam okuma süresi",
    kitaplar: "Kitaplar",
    kitaplarAlt: "Toplam süre Kobo'nun kendi sayacından; “takipte” bu uygulamanın gördüğü kısım",
    thKitap: "Kitap",
    thIlerleme: "İlerleme",
    thToplam: "Toplam",
    thTakipte: "Takipte",
    thSonOkuma: "Son okuma",
    thKalan: "Tahmini kalan",
    gunlukTablo: "Günlük tablo",
    thTarih: "Tarih",
    thSure: "Süre",
    bitti: tarih => tarih ? `Bitti · ${tarih}` : "Bitti",
    okunuyor: "Okunuyor",
    yuzde: n => `%${n}`,
    veriYok: "Veri yok",
    takipOncesi: tarih => `${tarih} · takip öncesi`,
    altBilgi: son => `Kobo'dan son aktarım: ${son}. Panel Kobo'yu Mac'e her taktığında güncellenir.`,
    dk: dk => `${dk} dk`,
    saDk: (sa, dk) => `${sa} sa ${dk} dk`,
    saEksen: sa => `${sa} sa`,
    lejant: ["0", "1–15 dk", "15–30 dk", "30–60 dk", "1 sa+"],
    aylar: ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"],
    ayKisa: ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"],
    gunKisa: ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"],
    kisaTarih: (gun, ay) => `${gun} ${ay}`,                        // 19 Eki
    uzunTarih: (gun, ay, haftaGunu) => `${gun} ${ay} ${haftaGunu}`, // 19 Ekim Pzt
  },
  en: {
    sayfaBasligi: "My Reading Stats",
    baslik: "My reading stats",
    kaynak: (sonVeri, takipBas) => `Latest data: ${sonVeri} · Tracking since: ${takipBas}`,
    uyari: "Warning",
    bugun: "Today",
    sonVeriGunu: tarih => `${tarih} (latest data)`,
    dun: s => `Yesterday: ${s}`,
    takipBugun: "Tracking started today",
    buHafta: "This week",
    pazartesidenBeri: "Since Monday",
    buAy: ay => `This month (${ay})`,
    seri: "Reading streak",
    gunSayisi: n => n === 1 ? "1 day" : `${n} days`,
    enUzun: gunler => `Longest: ${gunler}`,
    ortalama: "Daily average",
    takiptekiGunler: n => n === 1 ? "Over 1 tracked day" : `Over ${n} tracked days`,
    son30: "Last 30 days",
    bitenKitap: "Books finished",
    takipBasladigindanBeri: "Since tracking started",
    koboToplam: "Total on Kobo",
    tumKitaplar: "All books",
    gunlukAlt: "Daily reading time",
    takvimBaslik: "Reading calendar",
    takvimAlt: "Last 26 weeks; blank days are before tracking started",
    saatBaslik: "What time of day do I read?",
    saatAlt: "Total reading time by hour since tracking started",
    kitaplar: "Books",
    kitaplarAlt: "Total time comes from Kobo's own counter; “tracked” is the part this app has seen",
    thKitap: "Book",
    thIlerleme: "Progress",
    thToplam: "Total",
    thTakipte: "Tracked",
    thSonOkuma: "Last read",
    thKalan: "Est. time left",
    gunlukTablo: "Daily table",
    thTarih: "Date",
    thSure: "Time",
    bitti: tarih => tarih ? `Finished · ${tarih}` : "Finished",
    okunuyor: "Reading",
    yuzde: n => `${n}%`,
    veriYok: "No data",
    takipOncesi: tarih => `${tarih} · before tracking`,
    altBilgi: son => `Last import from Kobo: ${son}. The dashboard updates every time you plug the Kobo into your Mac.`,
    dk: dk => `${dk} min`,
    saDk: (sa, dk) => `${sa} h ${dk} min`,
    saEksen: sa => `${sa} h`,
    lejant: ["0", "1–15 min", "15–30 min", "30–60 min", "1 h+"],
    aylar: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
    ayKisa: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
    gunKisa: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    kisaTarih: (gun, ay) => `${ay} ${gun}`,                          // Oct 19
    uzunTarih: (gun, ay, haftaGunu) => `${haftaGunu}, ${ay} ${gun}`, // Mon, October 19
  },
};
const DIL = METINLER[V.dil] ? V.dil : "tr";
const M = METINLER[DIL];
const SVG = "http://www.w3.org/2000/svg";

// --- yardımcılar -------------------------------------------------------------------
const tarihAl = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const anahtar = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const gunEkle = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const kisaTarih = d => M.kisaTarih(d.getDate(), M.ayKisa[d.getMonth()]);
const uzunTarih = d => M.uzunTarih(d.getDate(), M.aylar[d.getMonth()], M.gunKisa[d.getDay()]);

function sure(sn) {
  const dk = Math.round(sn / 60);
  if (dk < 60) return M.dk(dk);
  return M.saDk(Math.floor(dk / 60), String(dk % 60).padStart(2, "0"));
}

function el(etiket, ozellik = {}, ...cocuklar) {
  const e = document.createElement(etiket);
  for (const [k, v] of Object.entries(ozellik)) {
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const c of cocuklar) if (c != null) e.append(c);
  return e;
}

function svgEl(etiket, ozellik = {}) {
  const e = document.createElementNS(SVG, etiket);
  for (const [k, v] of Object.entries(ozellik)) e.setAttribute(k, v);
  return e;
}

// Üstü 4px yuvarlatılmış, tabanı düz sütun.
function sutunYolu(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function temizAdim(maks) {
  for (const adim of [5, 10, 15, 30, 60, 90, 120, 180, 240, 360]) if (maks / adim <= 4) return adim;
  return Math.ceil(maks / 4 / 60) * 60;
}

// --- ipucu -------------------------------------------------------------------------
const ipucu = document.getElementById("ipucu");
function ipucuGoster(olay, deger, baslik, satirlar = []) {
  ipucu.replaceChildren(el("div", { class: "deger" }, deger), el("div", { class: "baslik" }, baslik));
  for (const [ad, val] of satirlar) ipucu.append(el("div", { class: "satir" }, el("span", {}, ad), el("b", {}, val)));
  ipucu.style.display = "block";
  let x, y;
  if (olay.clientX !== undefined && olay.type !== "focus") { x = olay.clientX; y = olay.clientY; }
  else { const r = olay.target.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  const g = ipucu.offsetWidth, h = ipucu.offsetHeight;
  ipucu.style.left = Math.max(8, Math.min(innerWidth - g - 8, x - g / 2)) + "px";
  ipucu.style.top = (y - h - 12 < 8 ? y + 16 : y - h - 12) + "px";
}
const ipucuGizle = () => { ipucu.style.display = "none"; };

function etkilesim(hedef, isaret, icerik) {
  const goster = e => { isaret && isaret.classList.add("aktif"); ipucuGoster(e, ...icerik()); };
  const gizle = () => { isaret && isaret.classList.remove("aktif"); ipucuGizle(); };
  hedef.addEventListener("pointermove", goster);
  hedef.addEventListener("pointerleave", gizle);
  hedef.addEventListener("focus", goster);
  hedef.addEventListener("blur", gizle);
}

// --- veri hazırlığı ------------------------------------------------------------------
const gunMap = new Map(V.gunler.map(g => [g.tarih, g]));
const veriGunu = tarihAl(V.olusturma);
const takipBas = tarihAl(V.takip_baslangic);
const gunSn = d => (gunMap.get(anahtar(d)) || { saniye: 0 }).saniye;
const takipte = d => d >= takipBas && d <= veriGunu;

function aralikToplam(bas, bit) {
  let t = 0;
  for (let d = bas; d <= bit; d = gunEkle(d, 1)) t += gunSn(d);
  return t;
}

function seriler() {
  let simdiki = 0;
  let d = gunSn(veriGunu) >= 60 ? veriGunu : gunEkle(veriGunu, -1);
  while (takipte(d) && gunSn(d) >= 60) { simdiki++; d = gunEkle(d, -1); }
  let enUzun = 0, s = 0;
  for (let d2 = takipBas; d2 <= veriGunu; d2 = gunEkle(d2, 1)) {
    s = gunSn(d2) >= 60 ? s + 1 : 0;
    enUzun = Math.max(enUzun, s);
  }
  return { simdiki, enUzun };
}

// --- üst bölüm -----------------------------------------------------------------------
function ustBolum() {
  const bugunMu = anahtar(new Date()) === anahtar(veriGunu);
  document.getElementById("hero-etiket").textContent = bugunMu ? M.bugun : M.sonVeriGunu(uzunTarih(veriGunu));
  document.getElementById("hero-deger").textContent = sure(gunSn(veriGunu));
  const dun = gunEkle(veriGunu, -1);
  document.getElementById("hero-alt").textContent =
    takipte(dun) ? M.dun(sure(gunSn(dun))) : M.takipBugun;

  const haftaBas = gunEkle(veriGunu, -((veriGunu.getDay() + 6) % 7));
  const ayBas = new Date(veriGunu.getFullYear(), veriGunu.getMonth(), 1);
  const otuzBas = gunEkle(veriGunu, -29);
  const ortBas = otuzBas < takipBas ? takipBas : otuzBas;
  const ortGun = Math.round((veriGunu - ortBas) / 864e5) + 1;
  const { simdiki, enUzun } = seriler();
  const biten = V.kitaplar.filter(k => k.bitis && takipte(tarihAl(k.bitis))).length;

  const karolar = [
    [M.buHafta, sure(aralikToplam(haftaBas, veriGunu)), M.pazartesidenBeri],
    [M.buAy(M.aylar[veriGunu.getMonth()]), sure(aralikToplam(ayBas, veriGunu)), null],
    [M.seri, M.gunSayisi(simdiki), M.enUzun(M.gunSayisi(enUzun))],
    [M.ortalama, sure(aralikToplam(ortBas, veriGunu) / ortGun), ortGun < 30 ? M.takiptekiGunler(ortGun) : M.son30],
    [M.bitenKitap, String(biten), M.takipBasladigindanBeri],
    [M.koboToplam, sure(V.kobo_toplam), M.tumKitaplar],
  ];
  const kap = document.getElementById("karolar");
  for (const [etiket, deger, alt] of karolar) {
    kap.append(el("div", {}, el("div", { class: "karo-etiket" }, etiket),
      el("div", { class: "karo-deger" }, deger), alt ? el("div", { class: "karo-alt" }, alt) : null));
  }

  const k = document.getElementById("kaynak");
  k.textContent = M.kaynak(`${uzunTarih(veriGunu)} ${V.olusturma.slice(11, 16)}`, uzunTarih(takipBas));
  if (V.uyari) {
    const ikon = svgEl("svg", { width: 18, height: 18, viewBox: "0 0 18 18", "aria-hidden": "true" });
    ikon.append(svgEl("path", { d: "M9 1.5 17 16H1Z", fill: "var(--warning)" }),
      svgEl("path", { d: "M9 6.5v4.5M9 13v.5", stroke: "#0b0b0b", "stroke-width": 1.8, "stroke-linecap": "round" }));
    document.getElementById("uyari-yeri").append(
      el("div", { class: "uyari", role: "alert" }, ikon, el("div", {}, el("strong", {}, M.uyari), V.uyari)));
  }
}

// --- sütun grafiği (30 gün ve saatler için ortak) ----------------------------------------
function sutunGrafik(kapId, ogeler, { xEtiketi, ipucuIcerik, birimDk = true }) {
  const kap = document.getElementById(kapId);
  const G = kap.clientWidth, Y = 200, sol = 34, alt = 26, ust = 18;
  const cizimG = G - sol;
  const degerler = ogeler.map(o => o.deger / 60);
  const maksDk = Math.max(...degerler, 1);
  const adim = temizAdim(maksDk);
  const ustSinir = Math.ceil(maksDk / adim) * adim;
  const yOlcek = v => ust + (Y - ust) * (1 - v / ustSinir);
  const bant = cizimG / ogeler.length;
  const cw = Math.max(2, Math.min(24, bant - 2));

  const svg = svgEl("svg", { width: G, height: Y + alt, role: "img" });
  for (let v = 0; v <= ustSinir; v += adim) {
    const y = yOlcek(v);
    svg.append(svgEl("line", { x1: sol, x2: G, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges" }));
    const t = svgEl("text", { x: sol - 6, y: y + 4, "text-anchor": "end" });
    t.textContent = v === 0 ? "0" : adim % 60 === 0 ? M.saEksen(v / 60) : String(v);
    svg.append(t);
  }

  const enBuyuk = degerler.indexOf(Math.max(...degerler));
  ogeler.forEach((o, i) => {
    const x = sol + i * bant + (bant - cw) / 2;
    const dk = degerler[i];
    let cubuk = null;
    if (dk > 0) {
      const h = Math.max(1, Y - yOlcek(dk));
      cubuk = svgEl("path", { d: sutunYolu(x, Y - h, cw, h), class: "cubuk" });
      svg.append(cubuk);
      if (i === enBuyuk) {
        const t = svgEl("text", { x: x + cw / 2, y: Y - h - 5, "text-anchor": "middle", class: "etiket" });
        t.textContent = sure(o.deger);
        svg.append(t);
      }
    }
    const etiket = xEtiketi(o, i);
    if (etiket) {
      const t = svgEl("text", { x: x + cw / 2, y: Y + 17, "text-anchor": "middle" });
      t.textContent = etiket;
      svg.append(t);
    }
    const hedef = svgEl("rect", { x: sol + i * bant, y: ust - 10, width: bant, height: Y - ust + 10, class: "hedef", tabindex: 0 });
    const [deger, baslik] = ipucuIcerik(o);
    hedef.setAttribute("aria-label", `${baslik}: ${deger}`);
    etkilesim(hedef, cubuk, () => ipucuIcerik(o));
    svg.append(hedef);
  });
  kap.replaceChildren(svg);
}

function gunlukGrafik() {
  const ogeler = [];
  for (let i = 29; i >= 0; i--) {
    const d = gunEkle(veriGunu, -i);
    const g = gunMap.get(anahtar(d));
    ogeler.push({ d, deger: g ? g.saniye : 0, kitaplar: g ? g.kitaplar : [], takipte: takipte(d) });
  }
  sutunGrafik("g-gunluk", ogeler, {
    xEtiketi: (o, i) => (i === 29 || (29 - i) % 7 === 0) ? kisaTarih(o.d) : null,
    ipucuIcerik: o => [
      o.takipte ? sure(o.deger) : M.veriYok,
      o.takipte ? uzunTarih(o.d) : M.takipOncesi(uzunTarih(o.d)),
      o.kitaplar.map(k => [k.baslik, sure(k.saniye)]),
    ],
  });
}

function saatGrafik() {
  const ogeler = V.saatlik.map((sn, saat) => ({ saat, deger: sn }));
  sutunGrafik("g-saat", ogeler, {
    xEtiketi: o => o.saat % 3 === 0 ? String(o.saat).padStart(2, "0") : null,
    ipucuIcerik: o => [sure(o.deger), `${String(o.saat).padStart(2, "0")}:00–${String((o.saat + 1) % 24).padStart(2, "0")}:00`],
  });
}

// --- takvim ısı haritası --------------------------------------------------------------
const KADEMELER = [0, 60, 15 * 60, 30 * 60, 60 * 60]
  .map((alt, i) => ({ alt, ad: M.lejant[i], renk: `var(--seq-${i})` }));
const kademe = sn => KADEMELER.reduce((s, k) => (sn >= k.alt ? k : s), KADEMELER[0]);

function takvim() {
  const kap = document.getElementById("g-takvim");
  const HAFTA = 26, sol = 30, ust = 18;
  const hucreAdim = Math.max(8, Math.min(18, Math.floor((kap.clientWidth - sol) / HAFTA)));
  const hucre = hucreAdim - 2;
  const buHaftaPzt = gunEkle(veriGunu, -((veriGunu.getDay() + 6) % 7));
  const bas = gunEkle(buHaftaPzt, -7 * (HAFTA - 1));
  const svg = svgEl("svg", { width: sol + HAFTA * hucreAdim, height: ust + 7 * hucreAdim, role: "img" });

  // Satırlar pazartesiden başlar; sadece pazartesi, çarşamba ve cuma yazılır.
  for (const r of [0, 2, 4]) {
    const t = svgEl("text", { x: 0, y: ust + r * hucreAdim + hucre - 1 });
    t.textContent = M.gunKisa[r + 1];
    svg.append(t);
  }

  let sonAy = -1;
  for (let h = 0; h < HAFTA; h++) {
    const haftaBas = gunEkle(bas, 7 * h);
    if (haftaBas.getMonth() !== sonAy && haftaBas.getDate() <= 7) {
      const t = svgEl("text", { x: sol + h * hucreAdim, y: 11 });
      t.textContent = M.ayKisa[haftaBas.getMonth()];
      svg.append(t);
      sonAy = haftaBas.getMonth();
    }
    for (let r = 0; r < 7; r++) {
      const d = gunEkle(haftaBas, r);
      if (!takipte(d)) continue;
      const sn = gunSn(d);
      const x = sol + h * hucreAdim, y = ust + r * hucreAdim;
      const kare = svgEl("rect", { x, y, width: hucre, height: hucre, rx: 2, fill: kademe(sn).renk, class: "hucre" });
      const hedef = svgEl("rect", { x: x - 1, y: y - 1, width: hucreAdim, height: hucreAdim, class: "hedef", tabindex: 0,
        "aria-label": `${uzunTarih(d)}: ${sure(sn)}` });
      const g = gunMap.get(anahtar(d));
      etkilesim(hedef, kare, () => [sure(sn), uzunTarih(d), (g ? g.kitaplar : []).map(k => [k.baslik, sure(k.saniye)])]);
      svg.append(kare, hedef);
    }
  }
  kap.replaceChildren(svg);

  const lejant = document.getElementById("takvim-lejant");
  lejant.replaceChildren();
  for (const k of KADEMELER) lejant.append(el("i", { style: `background:${k.renk}` }), el("span", {}, k.ad));
}

// --- tablolar ------------------------------------------------------------------------
function tablolar() {
  const govde = document.getElementById("kitaplar");
  for (const k of V.kitaplar) {
    const son = k.son_okuma ? tarihAl(k.son_okuma) : null;
    const durum = k.durum === 2 ? M.bitti(k.bitis ? kisaTarih(tarihAl(k.bitis)) : null) : M.okunuyor;
    govde.append(el("tr", {},
      el("td", { class: "kitap" }, el("div", {}, k.baslik), el("div", { class: "durum" }, durum)),
      el("td", {}, el("div", { class: "ilerleme" },
        el("div", { class: "metre" }, el("b", { style: `width:${k.yuzde}%` })), el("span", {}, M.yuzde(k.yuzde)))),
      el("td", { class: "sayi" }, sure(k.toplam)),
      el("td", { class: "sayi" }, k.takipte ? sure(k.takipte) : "–"),
      el("td", { class: "sayi" }, son ? kisaTarih(son) : "–"),
      el("td", { class: "sayi" }, k.kalan_tahmin ? `~${sure(k.kalan_tahmin)}` : "–"),
    ));
  }

  const gunluk = document.getElementById("gunluk-tablo");
  for (const g of [...V.gunler].reverse()) {
    gunluk.append(el("tr", {},
      el("td", {}, uzunTarih(tarihAl(g.tarih))),
      el("td", { class: "sayi" }, sure(g.saniye)),
      el("td", {}, g.kitaplar.map(k => `${k.baslik} (${sure(k.saniye)})`).join(", ") || "–"),
    ));
  }

  const son = V.son_aktarim ? `${uzunTarih(tarihAl(V.son_aktarim))} ${V.son_aktarim.slice(11, 16)}` : "–";
  document.getElementById("alt-bilgi").textContent = M.altBilgi(son);
}

function sabitMetinler() {
  document.documentElement.lang = DIL;
  document.title = M.sayfaBasligi;
  for (const e of document.querySelectorAll("[data-metin]")) e.textContent = M[e.dataset.metin];
}

function grafikler() { gunlukGrafik(); takvim(); saatGrafik(); }

sabitMetinler();
ustBolum();
tablolar();
grafikler();
let boyutZamanlayici;
addEventListener("resize", () => { clearTimeout(boyutZamanlayici); boyutZamanlayici = setTimeout(grafikler, 120); });
</script>
